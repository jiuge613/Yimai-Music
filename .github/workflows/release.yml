name: Release

# 推送到 main 即触发；若对应版本 tag 已存在则跳过，避免重复发版。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert branding is already applied
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 历史上这里有一个「批量把 RustMusic 替换成 Yimai」的步骤。
          # 仓库本身就是 jiuge613/YimaiMusic，那一步现在只会做两件坏事：
          #   1) 把上游署名改写成自指（RELEASE_NOTES 正是 Release 正文）
          #   2) 改写 src-tauri/src/updater.rs 里指向 GITHUB_REPO 的注释
          # 所以改为「只校验、不改写」：真出现未替换的遗留标识就明确失败。
          #
          # 注意只查**功能性标识符**（仓库地址 / 包名 / 可执行文件名），
          # 不能扫 .md 与注释——RELEASE_NOTES 的上游署名必须原样保留。
          $functional = @(
            'src-tauri\Cargo.toml',
            'src-tauri\tauri.conf.json',
            'installer\Yimai.iss',
            'installer\build.ps1',
            'src-tauri\src\updater.rs'
          )
          foreach ($f in $functional) {
            if (-not (Test-Path $f)) { Write-Error "缺少 $f"; exit 1 }
            $t = Get-Content -LiteralPath $f -Raw
            # 更新源与包名/可执行文件名里不能残留旧标识
            if ($f -match 'updater\.rs') {
              if ($t -notmatch 'jiuge613/Yimai-Music') {
                Write-Error 'updater.rs 的 GITHUB_REPO 未指向本仓库，自动更新会失效'; exit 1
              }
            } elseif ($t -match '(?i)rustmusic') {
              Write-Error "$f 仍含未替换的旧标识 rustmusic"; exit 1
            }
          }
          # 可执行文件名必须统一为 yimai.exe（Inno Setup 与更新脚本都依赖它）
          $iss = Get-Content installer\Yimai.iss -Raw
          if ($iss -notmatch 'MyAppExeName\s+"yimai\.exe"') {
            Write-Error 'installer/Yimai.iss 的 MyAppExeName 必须是 yimai.exe'; exit 1
          }
          Write-Host 'branding ok'

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version = $v"

      - name: Skip if tag already released
        id: guard
        shell: bash
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.ver.outputs.version }}" | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag v${{ steps.ver.outputs.version }} already exists, skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        if: steps.guard.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: steps.guard.outputs.skip == 'false'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        if: steps.guard.outputs.skip == 'false'
        run: npm install

      - name: Install Inno Setup
        if: steps.guard.outputs.skip == 'false'
        run: choco install innosetup --no-progress -y

      - name: Build Tauri release
        if: steps.guard.outputs.skip == 'false'
        run: npm run tauri build

      - name: Package installer
        if: steps.guard.outputs.skip == 'false'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          # ISCC 依赖 UTF-8 BOM 正确识别 .iss 里的中文，先确保带 BOM 再编译
          $issPath = "installer\Yimai.iss"
          $issText = [System.IO.File]::ReadAllText((Resolve-Path $issPath), [System.Text.UTF8Encoding]::new($false))
          [System.IO.File]::WriteAllText((Resolve-Path $issPath), $issText, [System.Text.UTF8Encoding]::new($true))
          & $iscc $issPath
          if ($LASTEXITCODE -ne 0) { throw "ISCC packaging failed" }
          Get-ChildItem installer\output\*.exe | ForEach-Object { Write-Host "built: $($_.Name) ($([math]::Round($_.Length/1MB,2)) MB)" }

      - name: Create tag and release
        if: steps.guard.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Yimai Music v${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: installer/output/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
