[package]
name = "yimai"
version = "1.1.2"
description = "Yimai Music - 精美的高性能音乐播放器"
authors = ["Yimai Music"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png：托盘图标从 1024px 的 icon.png 高清解码（避免默认窗口图标取 ICO 低尺寸图层在高 DPI 下模糊）
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.20", features = ["symphonia-mp3", "symphonia-aac", "symphonia-isomp4", "symphonia-vorbis", "symphonia-wav", "flac"] }
lofty = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
ureq = { version = "2", features = ["json"] }
percent-encoding = "2"
souvlaki = "0.8"
parking_lot = "0.12"
base64 = "0.22"
aes = "0.8"
regex = "1"
flate2 = "1"
md-5 = "0.10"
sha1 = "0.10"
hex = "0.4"
num-bigint = "0.4"
rand = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
filetime = "0.2"
# WASAPI 独占输出（src/exclusive.rs，仅 Windows）。用 target 限定，
# 让非 Windows 平台仍能编译这个 crate。
# 独占输出用 wasapi_out.rs（移植自上游项目），锁定 0.14：
# 该模块是照 wasapi 0.14 的 API 写的（0.24 改了 DeviceCollection/initialize_client
# 等接口，原样编译不过）。
wasapi = "0.14"
# wasapi_out.rs 依赖它：与 windows 0.61 并存的第二份 windows-rs（0.51），
# 用于匹配 wasapi 0.14 的 HRESULT/Error 签名。
windows51 = { package = "windows", version = "0.51", default-features = false }

[target.'cfg(windows)'.dependencies]
# WebView2 TrySuspend：托盘隐藏时挂起渲染进程回收内存
webview2-com = "0.38"
# Win32_Media_Audio*：独占模式要用的 IAudioClient HRESULT 常量与设备接口
windows = { version = "0.61", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
